<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2F4F6F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bibliotek">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bibliotek</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --primary: #2F4F6F; --primary-container: #D3E3F5; --secondary: #C8553D;
    --green: #2E7D32; --grey: #9AA0A6; --on-surface: #1C1B1F; --on-variant: #49454F;
    --outline: #79747E; --surface: #FFFBFE; --surface-2: #F3EFF4; --divider: #E7E0EC;
    --appbar: #2F4F6F; --on-primary: #FFFFFF; --backdrop: #DADCE0; --hover: rgba(0,0,0,.05);
  }
  :root[data-theme="dark"] {
    --primary: #A9C7E8; --primary-container: #2B4560; --secondary: #FFB4A3;
    --green: #81C784; --grey: #8E9196; --on-surface: #E6E1E5; --on-variant: #CAC4D0;
    --outline: #938F99; --surface: #141218; --surface-2: #211F26; --divider: #49454F;
    --appbar: #1E2B38; --on-primary: #0F2A43; --backdrop: #000000; --hover: rgba(255,255,255,.08);
  }
  * { box-sizing: border-box; }
  input { color: var(--on-surface); -webkit-text-fill-color: var(--on-surface); caret-color: var(--primary); }
  input::placeholder { color: var(--on-variant); -webkit-text-fill-color: var(--on-variant); opacity: .8; }
  html, body { margin: 0; height: 100%; background: var(--backdrop); font-family: Roboto, system-ui, sans-serif; color: var(--on-surface); }
  .phone { position: relative; max-width: 560px; height: 100%; height: 100dvh; margin: 0 auto; background: var(--surface); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 24px rgba(0,0,0,.15); }
  .banner { background: #FFF4D6; color: #5C4400; font-size: 12.5px; line-height: 1.4; padding: 8px 12px; display: flex; gap: 8px; align-items: flex-start; }
  .banner button { margin-left: auto; background: none; border: 0; font-size: 16px; color: #5C4400; cursor: pointer; padding: 0 4px; }
  .appbar { background: var(--appbar); color: #fff; height: calc(56px + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top) !important; display: flex; align-items: center; padding: 0 4px 0 16px; flex-shrink: 0; }
  .appbar h1 { font-size: 22px; font-weight: 400; margin: 0; flex: 1; }
  .icon-btn { width: 48px; height: 48px; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: inherit; padding: 0; }
  .icon-btn:hover { background: var(--hover); }
  .appbar .icon-btn:hover { background: rgba(255,255,255,.12); }
  .icon-btn svg { width: 24px; height: 24px; fill: currentColor; }
  .search { margin: 12px 16px 0; position: relative; }
  .search input { width: 100%; height: 48px; border: 1px solid var(--outline); border-radius: 4px; padding: 0 40px 0 44px; font: inherit; font-size: 16px; background: transparent; outline: none; }
  .search input:focus { border: 2px solid var(--primary); padding-left: 43px; }
  .search .s-icon { position: absolute; left: 12px; top: 12px; width: 24px; height: 24px; fill: var(--on-variant); }
  .search .clear { position: absolute; right: 0; top: 0; color: var(--on-variant); display: none; }
  .search.has-text .clear { display: grid; }
  .segmented { display: inline-flex; margin: 8px 16px 0; border: 1px solid var(--outline); border-radius: 20px; overflow: hidden; flex-shrink: 0; align-self: flex-start; }
  .segmented button { border: 0; border-right: 1px solid var(--outline); background: none; font: inherit; font-size: 14px; font-weight: 500; height: 36px; padding: 0 16px; cursor: pointer; color: var(--on-surface); display: flex; align-items: center; gap: 6px; }
  .segmented button:last-child { border-right: 0; }
  .segmented button.on { background: var(--primary-container); }
  .segmented button.on::before { content: "✓"; font-size: 13px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px 12px; flex-shrink: 0; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; height: 32px; border: 1px solid var(--outline); border-radius: 8px; background: none; padding: 0 12px; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--on-variant); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .chip.on { background: var(--primary-container); border-color: transparent; color: var(--on-surface); }
  .chip.on::before { content: "✓"; }
  .count { font-size: 12px; font-weight: 500; margin: 0 16px 4px; color: var(--on-surface); letter-spacing: .3px; }
  .list { flex: 1; overflow-y: auto; padding-bottom: 150px; }
  .row { display: flex; align-items: center; min-height: 56px; padding: 6px 4px 6px 16px; cursor: pointer; }
  .row:hover, .header:hover { background: var(--hover); }
  .row.grouped { padding-left: 40px; }
  .row .txt { flex: 1; min-width: 0; }
  .row .t { font-size: 16px; font-weight: 500; }
  .row .a { font-size: 14px; color: var(--on-variant); }
  .row .g { font-size: 11px; font-weight: 500; color: var(--secondary); margin-top: 2px; letter-spacing: .4px; }
  .row .read-btn { color: var(--grey); }
  .row .read-btn.on { color: var(--green); }
  .row a.icon-btn { color: var(--grey); }
  .header { display: flex; align-items: center; min-height: 52px; padding: 0 16px 0 8px; cursor: pointer; }
  .header .chev { width: 24px; height: 24px; fill: var(--on-variant); margin-right: 8px; transition: transform .15s; }
  .header.open .chev { transform: rotate(90deg); }
  .header .n { flex: 1; font-size: 16px; font-weight: 700; }
  .header .c { font-size: 12px; font-weight: 500; color: var(--on-variant); }
  .empty { padding: 32px; text-align: center; font-size: 16px; line-height: 1.5; color: var(--on-surface); white-space: pre-line; }
  .empty .demo { margin-top: 16px; }
  .fabs { position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); transition: bottom .2s; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .fab { border: 0; cursor: pointer; display: grid; place-items: center; box-shadow: 0 3px 6px rgba(0,0,0,.25); }
  .fab svg { fill: #fff; width: 24px; height: 24px; }
  .fab.big { width: 56px; height: 56px; border-radius: 16px; background: var(--primary-container); }
  .fab.big svg { fill: var(--primary); }
  .fab.mini { width: 40px; height: 40px; border-radius: 12px; background: #C8553D; }
  .menu { position: absolute; top: 52px; right: 8px; background: var(--surface-2); border-radius: 4px; box-shadow: 0 4px 12px rgba(0,0,0,.25); min-width: 230px; padding: 8px 0; z-index: 20; display: none; }
  .menu.open { display: block; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; font: inherit; font-size: 16px; padding: 12px 16px; cursor: pointer; color: var(--on-surface); }
  .menu button:hover { background: var(--hover); }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 30; padding: 24px; }
  .dialog { background: var(--surface-2); border-radius: 28px; width: 100%; max-width: 400px; max-height: 90%; display: flex; flex-direction: column; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  .dialog h2 { font-size: 24px; font-weight: 400; margin: 24px 24px 0; }
  .dialog .body { padding: 16px 24px 0; overflow-y: auto; font-size: 14px; line-height: 1.45; color: var(--on-variant); white-space: pre-line; }
  .dialog .actions { display: flex; gap: 8px; padding: 20px 24px 20px; align-items: center; }
  .dialog .actions .spacer { flex: 1; }
  .btn-text { border: 0; background: none; color: var(--primary); font: inherit; font-weight: 500; font-size: 14px; padding: 10px 12px; border-radius: 20px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
  .btn-text:hover { background: var(--hover); }
  .btn-text svg { width: 18px; height: 18px; fill: currentColor; }
  .btn-filled { border: 0; background: var(--primary); color: var(--on-primary); font: inherit; font-weight: 500; font-size: 14px; padding: 10px 24px; border-radius: 20px; cursor: pointer; }
  .list-choice { display: block; width: 100%; text-align: left; border: 0; background: none; font: inherit; font-size: 16px; color: var(--on-surface); padding: 14px 0; cursor: pointer; }
  .list-choice.on { font-weight: 700; }
  .list-choice.on::after { content: "  ✓"; color: var(--primary); }
  .field { position: relative; margin-top: 12px; }
  .field label { position: absolute; left: 12px; top: -8px; background: var(--surface-2); padding: 0 4px; font-size: 12px; color: var(--on-variant); white-space: normal; }
  .field input { width: 100%; height: 56px; border: 1px solid var(--outline); border-radius: 4px; padding: 0 16px; font: inherit; font-size: 16px; background: transparent; outline: none; color: var(--on-surface); }
  .field input:focus { border: 2px solid var(--primary); padding: 0 15px; }
  .field:focus-within label { color: var(--primary); }
  .switch-row { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; font-size: 16px; color: var(--on-surface); cursor: pointer; }
  .switch { width: 52px; height: 32px; border-radius: 16px; border: 2px solid var(--outline); position: relative; background: var(--divider); transition: .15s; flex-shrink: 0; }
  .switch::after { content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: var(--outline); top: 6px; left: 6px; transition: .15s; }
  .switch.on { background: var(--primary); border-color: var(--primary); }
  .switch.on::after { width: 24px; height: 24px; top: 2px; left: 22px; background: var(--on-primary); }
  .sugg-label { font-size: 12px; font-weight: 500; margin-top: 14px; color: var(--on-surface); white-space: normal; }
  .sugg { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .sugg .chip { background: var(--surface); }
  .progress { display: flex; align-items: center; gap: 20px; padding: 24px; font-size: 14px; color: var(--on-surface); }
  .spinner { width: 40px; height: 40px; border: 4px solid var(--primary-container); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .snackbar { position: absolute; left: 12px; right: 12px; bottom: 16px; background: #313033; color: #F4EFF4; border-radius: 4px; padding: 6px 8px 6px 16px; display: flex; align-items: center; min-height: 48px; font-size: 14px; z-index: 25; box-shadow: 0 3px 8px rgba(0,0,0,.3); }
  .snackbar span { flex: 1; }
  .snackbar button { border: 0; background: none; color: #D0BCFF; font: inherit; font-weight: 500; font-size: 14px; padding: 10px 12px; cursor: pointer; }
  .toast { position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%); background: rgba(50,50,50,.92); color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 14px; z-index: 40; max-width: 85%; text-align: center; line-height: 1.35; }
  .note { font-size: 12px; color: #7A5C00; background: #FFF4D6; border-radius: 8px; padding: 8px 10px; margin-top: 12px; line-height: 1.4; white-space: normal; }
  .phone.snack .fabs { bottom: 76px; }
  input[type=file] { display: none; }

  .sync { color: var(--on-variant); font-weight: 400; }
  .login { position: absolute; inset: 0; background: var(--appbar); color: #fff; display: flex; align-items: center; justify-content: center; z-index: 50; padding: 32px; text-align: center; }
  .login[hidden], .scanner[hidden] { display: none; }
  .login img { width: 96px; height: 96px; border-radius: 22px; }
  .login h1 { font-weight: 400; font-size: 32px; margin: 16px 0 8px; }
  .login p { opacity: .9; line-height: 1.5; margin: 0 0 24px; white-space: pre-line; }
  .login .btn-filled { background: #fff; color: #2F4F6F; font-size: 16px; padding: 12px 24px; display: inline-flex; align-items: center; gap: 12px; }
  .login .btn-filled svg { width: 20px; height: 20px; }
  .scanner { position: absolute; inset: 0; background: #000; z-index: 45; display: flex; flex-direction: column; }
  .scanner video { flex: 1; width: 100%; object-fit: cover; min-height: 0; }
  .scan-frame { position: absolute; left: 10%; right: 10%; top: 38%; height: 18%; border: 3px solid rgba(255,255,255,.9); border-radius: 12px; box-shadow: 0 0 0 9999px rgba(0,0,0,.35); pointer-events: none; }
  .scan-bar { background: #111; color: #fff; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .scan-bar span { flex: 1; }
  .scan-bar button { border: 0; background: none; color: #A9C7E8; font: inherit; font-weight: 500; padding: 10px 12px; cursor: pointer; }

  .toolrow { display: flex; align-items: center; gap: 8px; margin: 8px 16px 0; flex-wrap: wrap; }
  .toolrow .segmented { margin: 0; }
  .wish-btn { margin-left: auto; height: 36px; border: 1px solid var(--outline); border-radius: 18px; background: none; color: var(--on-surface); font: inherit; font-size: 14px; font-weight: 500; padding: 0 14px 0 10px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .wish-btn svg { width: 18px; height: 18px; fill: var(--secondary); }
  .wish-btn.on { background: var(--primary-container); border-color: transparent; }
  .header .tips-btn { width: 40px; height: 40px; margin-left: 4px; color: #E8B04B; }
  .header .tips-btn svg { width: 20px; height: 20px; }
  .row .bought-btn { color: var(--green); }
  .tips h3 { font-size: 13px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--primary); margin: 8px 0 4px; }
  .tips .progress.small { padding: 12px 0; gap: 12px; }
  .tips .progress.small .spinner { width: 24px; height: 24px; border-width: 3px; }
  .tip { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--divider); }
  .tip-txt { flex: 1; min-width: 0; white-space: normal; }
  .tip-t { font-size: 15px; font-weight: 500; color: var(--on-surface); }
  .tip-s { font-size: 12px; color: var(--on-variant); margin-top: 2px; }
  .tip-b { font-size: 11px; font-weight: 500; color: var(--green); margin-top: 2px; }
  .tip-actions { display: flex; align-items: center; flex-shrink: 0; }
  .tip-actions .icon-btn { width: 40px; height: 40px; color: var(--grey); }
  .tip-actions .tips-btn { color: #E8B04B; }
  .tip-actions .icon-btn svg { width: 20px; height: 20px; }
  .btn-text.small { padding: 6px 8px; font-size: 13px; }
  .tip-done { font-size: 12px; color: var(--green); padding: 0 8px; white-space: nowrap; }
  .tips .muted, .tips-source { font-size: 12px; color: var(--on-variant); white-space: normal; }
  .tips-source { margin-top: 12px; }

  .lang-filter { height: 36px; border: 1px solid var(--outline); border-radius: 18px; background: var(--surface); color: var(--on-surface); font: inherit; font-size: 14px; font-weight: 500; padding: 0 10px; cursor: pointer; }
  .row .m { font-size: 12px; color: var(--on-variant); margin-top: 1px; }
  .row .nt { font-size: 12px; font-style: italic; color: var(--on-variant); margin-top: 2px; }
  .who { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; color: var(--on-variant); flex-wrap: wrap; }
  .who span { margin-right: 4px; }
  .field-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .field-row .field { flex: 1; min-width: 110px; }
  .field-row .fetch-pages { margin-top: 12px; }
  .field select { width: 100%; height: 56px; border: 1px solid var(--outline); border-radius: 4px; padding: 0 12px; font: inherit; font-size: 16px; background: transparent; color: var(--on-surface); }
  .field select option { background: var(--surface-2); color: var(--on-surface); }
  .field textarea { width: 100%; border: 1px solid var(--outline); border-radius: 4px; padding: 14px 16px; font: inherit; font-size: 15px; background: transparent; color: var(--on-surface); resize: vertical; outline: none; -webkit-text-fill-color: var(--on-surface); }
  .field textarea:focus { border: 2px solid var(--primary); padding: 13px 15px; }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="appbar">
    <h1>Bibliotek</h1>
    <button class="icon-btn" id="menuBtn" aria-label="Fler alternativ"><svg viewBox="0 0 24 24"><path d="M12,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,10c-1.1,0 -2,0.9 -2,2s0.9,2 2,2 2,-0.9 2,-2 -0.9,-2 -2,-2zM12,16c-1.1,0 -2,0.9 -2,2s0.9,2 2,2 2,-0.9 2,-2 -0.9,-2 -2,-2z"/></svg></button>
  </div>
  <div class="menu" id="menu"></div>

  <div class="search" id="searchWrap">
    <svg class="s-icon" viewBox="0 0 24 24"><path d="M15.5,14h-0.79l-0.28,-0.27C15.41,12.59 16,11.11 16,9.5 16,5.91 13.09,3 9.5,3S3,5.91 3,9.5 5.91,16 9.5,16c1.61,0 3.09,-0.59 4.23,-1.57l0.27,0.28v0.79l5,4.99L20.49,19l-4.99,-5zM9.5,14C7.01,14 5,11.99 5,9.5S7.01,5 9.5,5 14,7.01 14,9.5 11.99,14 9.5,14z"/></svg>
    <input id="search" type="text" placeholder="Sök författare, titel, tagg eller ISBN" autocomplete="off">
    <button class="icon-btn clear" id="clearSearch" aria-label="Rensa"><svg viewBox="0 0 24 24"><path d="M19,6.41L17.59,5 12,10.59 6.41,5 5,6.41 10.59,12 5,17.59 6.41,19 12,13.41 17.59,19 19,17.59 13.41,12z"/></svg></button>
  </div>

  <div class="toolrow">
  <div class="segmented" id="statusGroup">
    <button data-s="all" class="on">Alla</button>
    <button data-s="unread">Olästa</button>
    <button data-s="read">Lästa</button>
  </div>
  <select class="lang-filter" id="langFilter" aria-label="Filtrera på språk">
    <option value="all">Alla språk</option>
    <option value="Svenska">Svenska</option>
    <option value="Engelska">Engelska</option>
    <option value="Ryska">Ryska</option>
    <option value="Övrigt">Övrigt</option>
    <option value="unknown">Okänt språk</option>
  </select>
  <button class="wish-btn" id="wishBtn" aria-label="Visa önskelistan"><svg viewBox="0 0 24 24"><path d="M12,21.35l-1.45,-1.32C5.4,15.36 2,12.28 2,8.5 2,5.42 4.42,3 7.5,3c1.74,0 3.41,0.81 4.5,2.09C13.09,3.81 14.76,3 16.5,3 19.58,3 22,5.42 22,8.5c0,3.78 -3.4,6.86 -8.55,11.54L12,21.35z"/></svg><span>Önskelista</span></button>
  </div>

  <div class="chips" id="chips"></div>
  <div class="count" id="count"></div>
  <div class="list" id="list"></div>

  <div class="fabs">
    <button class="fab mini" id="scanBtn" aria-label="Skanna streckkod"><svg viewBox="0 0 24 24"><path d="M2,5h2v14H2zM5,5h1v14H5zM7,5h3v14H7zM11,5h1v14h-1zM13,5h2v14h-2zM16,5h1v14h-1zM18,5h1v14h-1zM20,5h2v14h-2z"/></svg></button>
    <button class="fab big" id="addBtn" aria-label="Lägg till bok"><svg viewBox="0 0 24 24"><path d="M19,13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
  </div>

  <div class="scanner" id="scanner" hidden>
    <video id="scanVideo" playsinline muted></video>
    <div class="scan-frame"></div>
    <div class="scan-bar">
      <span>Rikta kameran mot bokens streckkod</span>
      <button id="scanManual">Skriv ISBN</button>
      <button id="scanClose">Avbryt</button>
    </div>
  </div>

  <div class="login" id="login">
    <div>
      <img src="icon-192.png" alt="">
      <h1>Bibliotek</h1>
      <p id="loginMsg">Laddar …</p>
      <button class="btn-filled" id="loginBtn" hidden>
        <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 38.2 44 33 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Logga in med Google
      </button>
